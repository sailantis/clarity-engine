name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      # `composer.lock` is tracked, so validate it too: without this, a
      # composer.json edit that was never re-locked would pass, and CI would
      # silently test a dependency set that no longer matches the manifest.
      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Run test suite
        run: composer test
